<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Etiquetas 57mm</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- PWA Config -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d110f">
    
    <style>
        :root {
            --bg-dark: #0d110f;
            --panel-bg: #151a17;
            --retro-green: #849c82;
            --offset-y: 0px; /* Variable global de arquitectura para el centrado */
        }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--retro-green);
            font-family: 'Courier New', Courier, monospace; 
        }
        
        .panel-retro {
            background-color: var(--panel-bg);
            border: 1px solid var(--retro-green);
        }
        .input-retro {
            background-color: var(--bg-dark);
            border: 1px solid var(--retro-green);
            color: var(--retro-green);
        }
        .input-retro::placeholder { color: #4a5c48; }
        .input-retro:focus { outline: none; box-shadow: 0 0 5px var(--retro-green); }
        
        .btn-retro {
            background-color: var(--retro-green);
            color: var(--bg-dark);
            font-weight: bold;
            border: 1px solid var(--retro-green);
            transition: all 0.2s;
        }
        .btn-retro:hover {
            background-color: var(--bg-dark);
            color: var(--retro-green);
        }
        
        /* Contenedores por formato */
        .formato-orgbro {
            width: 57mm; min-height: 20mm; background-color: white; 
            padding: 0; box-sizing: border-box; display: grid; 
            grid-template-columns: repeat(5, 1fr); align-content: start; gap: 1px; 
        }
        .formato-p15 {
            width: 40mm; min-height: 12mm; background-color: white; 
            padding: 0; box-sizing: border-box; display: flex;
            flex-direction: column; gap: 2px; align-items: center;
        }
        .formato-envio {
            width: 57mm; display: flex; flex-direction: column;
            align-items: center; gap: 6px; background-color: white;
            padding: 2mm; box-sizing: border-box;
        }

        /* Estructura básica de etiquetas */
        .etiqueta {
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; font-family: 'Bitcount Prop Single', monospace; 
            line-height: 1; font-weight: 600; color: black; cursor: pointer; 
            overflow: hidden; text-align: center; box-sizing: border-box; 
            word-break: break-word; position: relative;
        }
        .etiqueta-orgbro { aspect-ratio: 1 / 1; border: 1px dashed #000; font-size: 14px; padding: 2px; }
        .etiqueta-p15 { width: 40mm; height: 12mm; border: 1px dashed #000; padding: 2px; border-radius: 4px; }
        .etiqueta-envio {
            width: 57mm; border: 1.5px solid #000; border-radius: 8px; padding: 6px;
            background-color: #fff; color: #000; box-sizing: border-box; font-family: 'Bitcount Prop Single', monospace; position: relative;
        }

        .etiqueta:hover, .etiqueta-envio:hover { border-color: #ef4444; }
        .etiqueta-en-edicion { outline: 2px solid #22c55e !important; box-shadow: 0 0 8px rgba(34, 197, 94, 0.8); }

        /* Corrección de centro escalable por variable CSS */
        .correccion-centro {
            display: block;
            width: 100%;
            transform: translateY(var(--offset-y));
        }

        /* Utilidades UI */
        .scrollbar-oculta::-webkit-scrollbar { display: none; }
        .scrollbar-oculta { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(-20px); } 15% { opacity: 1; transform: translateY(0); } 85% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }
        .toast-animado { animation: fadeInOut 2.5s ease-in-out forwards; }
    </style>
</head>
<body class="p-4 sm:p-6 flex flex-col items-center min-h-screen">
    
    <div id="toast" class="hidden fixed top-5 panel-retro text-[var(--retro-green)] px-6 py-3 shadow-lg z-[100] font-bold text-sm tracking-widest uppercase"></div>

    <!-- Modal de Vista Previa -->
    <div id="modal-preview" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="panel-retro w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl border-2 border-[var(--retro-green)]">
            <div class="flex justify-between items-center p-3 border-b border-[var(--retro-green)] bg-[var(--panel-bg)]">
                <h2 class="text-sm sm:text-lg font-bold uppercase tracking-widest">👁️ Vista Previa</h2>
                <button id="btn-cerrar-modal" class="text-xs sm:text-sm font-bold border border-red-500 text-red-500 px-3 py-1 hover:bg-red-950 transition-colors">✕ CERRAR</button>
            </div>
            
            <div class="p-6 overflow-auto flex justify-center bg-gray-300 scrollbar-oculta">
                <!-- Aquí se inyectará la imagen del Canvas -->
                <img id="preview-img" src="" alt="Vista Previa de Etiquetas" class="shadow-xl bg-white max-w-full">
            </div>
            
            <div class="p-4 border-t border-[var(--retro-green)] flex flex-wrap justify-end gap-3 bg-[var(--bg-dark)]">
                <button id="btn-imprimir-modal" class="px-4 py-2 border border-blue-400 text-blue-400 font-bold uppercase text-xs hover:bg-blue-950 transition-colors">
                    🖨️ Imprimir
                </button>
                <button id="btn-descargar-modal" class="btn-retro px-6 py-2 uppercase font-bold text-xs">
                    💾 Descargar PNG
                </button>
            </div>
        </div>
    </div>

    <!-- Encabezado -->
    <div class="w-full max-w-lg mb-6 flex justify-between items-end border-b border-[var(--retro-green)] pb-2">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold uppercase tracking-wider">Terminal Print</h1>
            <p class="text-xs opacity-80">User: Admin | Status: Online</p>
        </div>
        <div id="contador" class="text-sm font-bold border border-[var(--retro-green)] px-2 py-1 bg-[var(--panel-bg)]">
            [ 0 / 115 ]
        </div>
    </div>

    <!-- Selector de Impresora -->
    <div class="w-full max-w-lg mb-4 flex flex-wrap gap-2 justify-center">
        <button id="btn-orgbro" class="btn-retro px-3 py-1.5 uppercase text-xs tracking-wider">ORGBRO (57mm)</button>
        <button id="btn-p15" class="px-3 py-1.5 uppercase text-xs font-bold border border-[var(--retro-green)] text-[var(--retro-green)] tracking-wider">LIFE P15 (40x12)</button>
        <button id="btn-envio" class="px-3 py-1.5 uppercase text-xs font-bold border border-[var(--retro-green)] text-[var(--retro-green)] tracking-wider">ENVÍOS (57mm)</button>
    </div>

    <!-- Panel Centralizado de Configuración -->
    <div id="panel-configuracion" class="panel-retro w-full max-w-lg mb-6 p-4 shadow-lg flex flex-col gap-4">
        <div class="text-xs uppercase font-bold tracking-widest border-b border-[var(--retro-green)] pb-2 flex items-center justify-between">
            <span>⚙️ Configuración</span>
            <span class="opacity-70 text-[10px]">Ajustes Visuales</span>
        </div>

        <!-- Slider Tamaño P15 -->
        <div id="control-tamano" class="hidden flex-col sm:flex-row items-center justify-between gap-3 w-full">
            <label for="slider-tamano" class="text-xs uppercase font-bold tracking-wider">Tamaño Fuente (P15): <span id="display-tamano">14px</span></label>
            <input type="range" id="slider-tamano" min="8" max="26" value="14" class="w-full sm:w-48 accent-[var(--retro-green)] cursor-pointer">
        </div>

        <!-- Slider Desplazamiento Y (Global) -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 w-full">
            <label for="slider-offset" class="text-xs uppercase font-bold tracking-wider">Centrado Vertical (Y): <span id="display-offset">0px</span></label>
            <input type="range" id="slider-offset" min="-15" max="15" value="0" class="w-full sm:w-48 accent-[var(--retro-green)] cursor-pointer" title="Sube o baja el texto para ajustar a la tipografía">
        </div>
    </div>

    <!-- Panel Estándar (ORGBRO y P15) -->
    <div id="panel-estandar" class="panel-retro flex flex-wrap gap-4 mb-6 justify-center w-full max-w-lg items-center p-5 shadow-lg">
        <input type="text" id="texto-etiqueta" placeholder="Texto" class="input-retro p-2 w-36 text-center tracking-widest">
        
        <div class="flex items-center gap-2">
            <span class="text-xs uppercase">Qty:</span>
            <input type="number" id="cantidad-etiquetas" min="1" max="115" value="1" class="input-retro p-2 w-16 text-center">
        </div>
        
        <button id="btn-agregar" class="btn-retro px-6 py-2 uppercase tracking-widest flex items-center gap-2">
            <span id="btn-agregar-icon" class="text-lg leading-none">+</span> <span id="btn-agregar-text">Add</span>
        </button>
        <button id="btn-cancelar-estandar" class="hidden px-3 py-2 text-xs uppercase font-bold border border-red-500 text-red-400 hover:bg-red-950">
            Cancel
        </button>
    </div>

    <!-- Panel Especial para Envíos (3 Campos) -->
    <div id="panel-envio" class="hidden panel-retro flex flex-col gap-3 mb-6 w-full max-w-lg p-5 shadow-lg">
        <div id="banner-edicion-envio" class="hidden bg-[var(--retro-green)] text-[var(--bg-dark)] px-3 py-1 text-xs font-bold uppercase tracking-wider flex justify-between items-center rounded-sm">
            <span>MODO EDICIÓN: Modifica los campos y guarda</span>
            <button id="btn-cancelar-envio" class="underline hover:text-black">Cancelar</button>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-xs uppercase tracking-wider">Recibe (Nombre):</label>
            <input type="text" id="envio-recibe" placeholder="Ej: Julian" class="input-retro p-2 w-full">
        </div>
        
        <div class="flex flex-col gap-1">
            <label class="text-xs uppercase tracking-wider">Punto de Entrega (Dirección / Lugar):</label>
            <input type="text" id="envio-direccion" placeholder="Ej: Riomaggiore City Tower" class="input-retro p-2 w-full">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-xs uppercase tracking-wider">Teléfono:</label>
            <input type="text" id="envio-telefono" placeholder="Ej: 314 7674496" class="input-retro p-2 w-full">
        </div>

        <div class="flex justify-between items-center mt-2 border-t border-[var(--retro-green)] pt-3">
            <div class="flex items-center gap-2">
                <span class="text-xs uppercase">Qty:</span>
                <input type="number" id="cantidad-envio" min="1" max="20" value="1" class="input-retro p-2 w-16 text-center">
            </div>
            
            <button id="btn-agregar-envio" class="btn-retro px-6 py-2 uppercase tracking-widest flex items-center gap-2">
                <span id="btn-envio-icon" class="text-lg leading-none">+</span> <span id="btn-envio-text">Add Guía</span>
            </button>
        </div>
    </div>

    <!-- Lienzo de Vista Previa -->
    <div class="w-full max-w-md overflow-x-auto flex justify-center panel-retro p-4 mb-6 shadow-lg">
        <div id="contenedor-etiquetas" class="formato-orgbro"></div>
    </div>

    <!-- Botones de Acción (Modificado) -->
    <div class="flex gap-4 w-full max-w-md justify-between border-t border-[var(--retro-green)] pt-4">
        <button id="btn-limpiar" class="px-4 py-2 uppercase text-xs font-bold border border-[var(--retro-green)] hover:bg-[var(--retro-green)] hover:text-[var(--bg-dark)] transition-colors text-[var(--retro-green)]">
            Clear Data
        </button>
        <button id="btn-previsualizar" class="btn-retro px-6 py-2 uppercase text-sm flex gap-2 items-center">
            👁️ Previsualizar
        </button>
    </div>

    <script>
        // DOM Elements
        const contenedor = document.getElementById('contenedor-etiquetas');
        const inputTexto = document.getElementById('texto-etiqueta');
        const inputCantidad = document.getElementById('cantidad-etiquetas');
        const contador = document.getElementById('contador');
        const toast = document.getElementById('toast');
        
        // Settings Panel
        const controlTamano = document.getElementById('control-tamano');
        const sliderTamano = document.getElementById('slider-tamano');
        const displayTamano = document.getElementById('display-tamano');
        const sliderOffset = document.getElementById('slider-offset');
        const displayOffset = document.getElementById('display-offset');

        // Modal Elements
        const modalPreview = document.getElementById('modal-preview');
        const previewImg = document.getElementById('preview-img');
        const btnCerrarModal = document.getElementById('btn-cerrar-modal');
        const btnPrevisualizar = document.getElementById('btn-previsualizar');
        const btnDescargarModal = document.getElementById('btn-descargar-modal');
        const btnImprimirModal = document.getElementById('btn-imprimir-modal');
        
        const panelEstandar = document.getElementById('panel-estandar');
        const panelEnvio = document.getElementById('panel-envio');
        const inputRecibe = document.getElementById('envio-recibe');
        const inputDireccion = document.getElementById('envio-direccion');
        const inputTelefono = document.getElementById('envio-telefono');
        const inputCantidadEnvio = document.getElementById('cantidad-envio');

        const btnOrgbro = document.getElementById('btn-orgbro');
        const btnP15 = document.getElementById('btn-p15');
        const btnEnvio = document.getElementById('btn-envio');

        const btnAgregar = document.getElementById('btn-agregar');
        const btnAgregarText = document.getElementById('btn-agregar-text');
        const btnAgregarIcon = document.getElementById('btn-agregar-icon');
        const btnCancelarEstandar = document.getElementById('btn-cancelar-estandar');

        const btnAgregarEnvio = document.getElementById('btn-agregar-envio');
        const btnEnvioText = document.getElementById('btn-envio-text');
        const btnEnvioIcon = document.getElementById('btn-envio-icon');
        const bannerEdicionEnvio = document.getElementById('banner-edicion-envio');
        const btnCancelarEnvio = document.getElementById('btn-cancelar-envio');

        const btnLimpiar = document.getElementById('btn-limpiar');
        
        let impresoraActual = 'orgbro'; 
        let MAX_ETIQUETAS = 115; 
        let etiquetasArray = []; 
        let indiceEdicion = null;
        
        // Estado del Desplazamiento Vertical Y
        let offsetsGuardados = { orgbro: -2, p15: -1, envio: 0 };

        const SVGS = {
            package: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line><line x1="17" y1="4.5" x2="21" y2="4.5"></line></svg>`,
            user: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`,
            location: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`,
            phone: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>`
        };

        function mostrarToast(mensaje) {
            if (!toast) return;
            toast.textContent = mensaje;
            toast.classList.remove('hidden');
            toast.classList.add('toast-animado');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-animado');
            }, 2500);
        }
        
        // Controlador de la variable CSS para el centrado vertical
        function aplicarOffsetY(valor) {
            document.documentElement.style.setProperty('--offset-y', valor + 'px');
            if (displayOffset) displayOffset.textContent = valor + 'px';
            offsetsGuardados[impresoraActual] = valor;
            localStorage.setItem('offsetsEtiquetas', JSON.stringify(offsetsGuardados));
        }

        sliderOffset?.addEventListener('input', (e) => aplicarOffsetY(e.target.value));

        function setImpresora(tipo) {
            if (indiceEdicion !== null) cancelarEdicion();
            impresoraActual = tipo;
            
            const btnActivo = "btn-retro px-3 py-1.5 uppercase text-xs tracking-wider truncate";
            const btnInactivo = "px-3 py-1.5 uppercase text-xs font-bold border border-[var(--retro-green)] hover:bg-[var(--retro-green)] hover:text-[var(--bg-dark)] transition-colors text-[var(--retro-green)] bg-transparent tracking-wider truncate";

            if (btnOrgbro) btnOrgbro.className = tipo === 'orgbro' ? btnActivo : btnInactivo;
            if (btnP15) btnP15.className = tipo === 'p15' ? btnActivo : btnInactivo;
            if (btnEnvio) btnEnvio.className = tipo === 'envio' ? btnActivo : btnInactivo;

            if (tipo === 'orgbro') {
                MAX_ETIQUETAS = 115;
                if (controlTamano) { controlTamano.classList.add('hidden'); controlTamano.classList.remove('flex'); }
                if (panelEstandar) panelEstandar.classList.remove('hidden');
                if (panelEnvio) panelEnvio.classList.add('hidden');
                if (contenedor) contenedor.className = "formato-orgbro";
            } else if (tipo === 'p15') {
                MAX_ETIQUETAS = 50;
                if (controlTamano) { controlTamano.classList.remove('hidden'); controlTamano.classList.add('flex'); }
                if (panelEstandar) panelEstandar.classList.remove('hidden');
                if (panelEnvio) panelEnvio.classList.add('hidden');
                if (contenedor) contenedor.className = "formato-p15";
            } else if (tipo === 'envio') {
                MAX_ETIQUETAS = 20;
                if (controlTamano) { controlTamano.classList.add('hidden'); controlTamano.classList.remove('flex'); }
                if (panelEstandar) panelEstandar.classList.add('hidden');
                if (panelEnvio) panelEnvio.classList.remove('hidden');
                if (contenedor) contenedor.className = "formato-envio";
            }
            
            // Cargar y aplicar el Offset de la impresora seleccionada
            if (sliderOffset) sliderOffset.value = offsetsGuardados[tipo];
            aplicarOffsetY(offsetsGuardados[tipo]);
            
            if (etiquetasArray.length > MAX_ETIQUETAS) {
                etiquetasArray = etiquetasArray.slice(0, MAX_ETIQUETAS);
                mostrarToast('SYSTEM: DATA TRUNCATED');
            }
            
            localStorage.setItem('impresoraSeleccionada', tipo);
            renderizarEtiquetas();
        }

        btnOrgbro?.addEventListener('click', () => setImpresora('orgbro'));
        btnP15?.addEventListener('click', () => setImpresora('p15'));
        btnEnvio?.addEventListener('click', () => setImpresora('envio'));

        function cargarParaEditar(index) {
            const item = etiquetasArray[index];
            if (!item) return;
            indiceEdicion = index;

            if (typeof item === 'object') {
                if (impresoraActual !== 'envio') setImpresora('envio');
                if (inputRecibe) inputRecibe.value = item.recibe || '';
                if (inputDireccion) inputDireccion.value = item.direccion || '';
                if (inputTelefono) inputTelefono.value = item.telefono || '';
                if (btnEnvioText) btnEnvioText.textContent = 'Guardar';
                if (btnEnvioIcon) btnEnvioIcon.textContent = '✓';
                if (bannerEdicionEnvio) bannerEdicionEnvio.classList.remove('hidden');
                inputRecibe?.focus();
            } else {
                if (impresoraActual === 'envio') setImpresora('orgbro');
                if (inputTexto) inputTexto.value = item;
                if (btnAgregarText) btnAgregarText.textContent = 'Guardar';
                if (btnAgregarIcon) btnAgregarIcon.textContent = '✓';
                if (btnCancelarEstandar) btnCancelarEstandar.classList.remove('hidden');
                inputTexto?.focus();
            }
            mostrarToast(`MODO EDICIÓN: #${index + 1}`);
            renderizarEtiquetas();
        }

        function cancelarEdicion() {
            indiceEdicion = null;
            if (inputRecibe) inputRecibe.value = '';
            if (inputDireccion) inputDireccion.value = '';
            if (inputTelefono) inputTelefono.value = '';
            if (btnEnvioText) btnEnvioText.textContent = 'Add Guía';
            if (btnEnvioIcon) btnEnvioIcon.textContent = '+';
            if (bannerEdicionEnvio) bannerEdicionEnvio.classList.add('hidden');

            if (inputTexto) inputTexto.value = '';
            if (btnAgregarText) btnAgregarText.textContent = 'Add';
            if (btnAgregarIcon) btnAgregarIcon.textContent = '+';
            if (btnCancelarEstandar) btnCancelarEstandar.classList.add('hidden');
            renderizarEtiquetas();
        }

        function eliminarEtiqueta(index, e) {
            if (e) e.stopPropagation();
            if (indiceEdicion === index) cancelarEdicion();
            else if (indiceEdicion !== null && index < indiceEdicion) indiceEdicion--;
            etiquetasArray.splice(index, 1);
            renderizarEtiquetas();
            mostrarToast('SYSTEM: DELETED');
        }

        btnCancelarEstandar?.addEventListener('click', cancelarEdicion);
        btnCancelarEnvio?.addEventListener('click', cancelarEdicion);

        function renderizarEtiquetas() {
            if (!contenedor) return;
            contenedor.innerHTML = '';
            
            const tamanoActivo = (sliderTamano?.value || 14) + 'px';
            if (displayTamano) displayTamano.textContent = tamanoActivo;
            
            etiquetasArray.forEach((item, index) => {
                const div = document.createElement('div');
                const esEdicion = (index === indiceEdicion);

                if (impresoraActual === 'envio') {
                    div.className = `etiqueta-envio cursor-pointer transition-colors ${esEdicion ? 'etiqueta-en-edicion' : ''}`;
                    const nombreUpper = (typeof item === 'object' && item.recibe ? item.recibe : 'CLIENTE').toUpperCase();
                    div.innerHTML = `
                        <button data-html2canvas-ignore="true" onclick="eliminarEtiqueta(${index}, event)" class="absolute -top-2 -right-2 bg-red-600 text-white hover:bg-red-800 rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold z-20 shadow">✕</button>
                        <div class="flex items-center gap-2 pb-2 mb-1 border-b border-dashed border-black">
                            <div class="bg-black text-white p-1.5 rounded-lg flex items-center justify-center">${SVGS.package}</div>
                            <span class="text-lg font-bold tracking-wide">Entrega especial</span>
                        </div>
                        <div class="flex items-center gap-2 py-1 border-b border-dashed border-black">
                            <div class="border border-black p-1.5 rounded-lg flex items-center justify-center shrink-0">${SVGS.user}</div>
                            <div class="border-l border-dashed border-black pl-2 flex-1">
                                <div class="text-[9px] font-bold tracking-wider uppercase">RECIBE:</div>
                                <div class="text-base font-bold leading-tight uppercase">${typeof item === 'object' ? (item.recibe || '') : item}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 py-1 border-b border-dashed border-black">
                            <div class="border border-black p-1.5 rounded-lg flex items-center justify-center shrink-0">${SVGS.location}</div>
                            <div class="border-l border-dashed border-black pl-2 flex-1">
                                <div class="text-[9px] font-bold tracking-wider uppercase">PUNTO DE ENTREGA:</div>
                                <div class="text-sm font-bold leading-tight">${typeof item === 'object' ? (item.direccion || '') : ''}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 py-1 pb-2 border-b-2 border-solid border-black">
                            <div class="border border-black p-1.5 rounded-lg flex items-center justify-center shrink-0">${SVGS.phone}</div>
                            <div class="border-l border-dashed border-black pl-2 flex-1">
                                <div class="text-[8px] font-bold tracking-wider uppercase">TELÉFONO DE ${nombreUpper}:</div>
                                <div class="text-base font-bold tracking-wider">${typeof item === 'object' ? (item.telefono || '') : ''}</div>
                            </div>
                        </div>
                        <div class="text-center text-xs font-bold pt-1">Gracias por tu compra</div>
                    `;
                } else {
                    div.className = `etiqueta ${impresoraActual === 'orgbro' ? 'etiqueta-orgbro' : 'etiqueta-p15'} ${esEdicion ? 'etiqueta-en-edicion' : ''}`;
                    
                    const btnDel = document.createElement('button');
                    btnDel.setAttribute('data-html2canvas-ignore', 'true');
                    btnDel.className = 'absolute top-0 right-0 bg-red-600 text-white rounded-bl w-4 h-4 flex items-center justify-center text-[9px] font-bold z-20 opacity-80 hover:opacity-100';
                    btnDel.textContent = '✕';
                    btnDel.onclick = (e) => eliminarEtiqueta(index, e);
                    div.appendChild(btnDel);

                    const span = document.createElement('span');
                    span.className = 'correccion-centro'; // La clase ya no necesita centro-orgbro, usa la variable global
                    span.textContent = typeof item === 'object' ? item.recibe : item;
                    
                    if (impresoraActual === 'p15') div.style.fontSize = tamanoActivo;
                    div.appendChild(span);
                }

                div.onclick = (e) => { if (e.target.tagName !== 'BUTTON') cargarParaEditar(index); };
                contenedor.appendChild(div);
            });
            
            let vacios = 0;
            if (impresoraActual === 'orgbro') {
                if (etiquetasArray.length === 0) vacios = 5; 
                else if (etiquetasArray.length % 5 !== 0) vacios = 5 - (etiquetasArray.length % 5); 
            } else if ((impresoraActual === 'p15' || impresoraActual === 'envio') && etiquetasArray.length === 0) {
                vacios = 1; 
            }
            
            for(let i = 0; i < vacios; i++) {
                const divVacio = document.createElement('div');
                if (impresoraActual === 'envio') {
                    divVacio.className = 'etiqueta-envio border-dashed border-gray-300 opacity-40 text-center py-6 text-xs text-black';
                    divVacio.style.pointerEvents = 'none';
                    divVacio.textContent = '[ VISTA PREVIA GUÍA ]';
                } else {
                    divVacio.className = `etiqueta border-gray-300 text-transparent ${impresoraActual === 'orgbro' ? 'etiqueta-orgbro' : 'etiqueta-p15'}`;
                    divVacio.style.pointerEvents = 'none';
                    const spanVacio = document.createElement('span');
                    spanVacio.className = 'correccion-centro';
                    spanVacio.textContent = '-';
                    divVacio.appendChild(spanVacio);
                }
                contenedor.appendChild(divVacio);
            }
            
            if (contador) contador.textContent = `[ ${etiquetasArray.length} / ${MAX_ETIQUETAS} ]`;
            if (inputCantidad) inputCantidad.max = MAX_ETIQUETAS;
            guardarEnMemoria();
        }

        btnAgregar?.addEventListener('click', () => {
            if (!inputTexto) return;
            const texto = inputTexto.value.trim();
            if (texto === '') return;
            if (indiceEdicion !== null) {
                etiquetasArray[indiceEdicion] = texto;
                cancelarEdicion();
            } else {
                const cantidad = parseInt(inputCantidad?.value || '1') || 1;
                for(let i = 0; i < cantidad; i++) if (etiquetasArray.length < MAX_ETIQUETAS) etiquetasArray.push(texto);
                inputTexto.value = ''; inputTexto.focus();
                renderizarEtiquetas();
            }
        });

        btnAgregarEnvio?.addEventListener('click', () => {
            const recibe = inputRecibe?.value.trim() || '';
            const direccion = inputDireccion?.value.trim() || '';
            const telefono = inputTelefono?.value.trim() || '';
            if (!recibe || !direccion || !telefono) { mostrarToast('CAMPOS INCOMPLETOS'); return; }
            if (indiceEdicion !== null) {
                etiquetasArray[indiceEdicion] = { recibe, direccion, telefono };
                cancelarEdicion();
            } else {
                const cantidad = parseInt(inputCantidadEnvio?.value || '1') || 1;
                for(let i = 0; i < cantidad; i++) if (etiquetasArray.length < MAX_ETIQUETAS) etiquetasArray.push({ recibe, direccion, telefono });
                if (inputRecibe) inputRecibe.value = '';
                if (inputDireccion) inputDireccion.value = '';
                if (inputTelefono) inputTelefono.value = '';
                inputRecibe?.focus();
                renderizarEtiquetas();
            }
        });

        inputTexto?.addEventListener('keypress', (e) => { if (e.key === 'Enter') btnAgregar?.click(); });
        btnLimpiar?.addEventListener('click', () => { etiquetasArray = []; cancelarEdicion(); });
        
        sliderTamano?.addEventListener('input', () => {
            if(impresoraActual === 'p15') { renderizarEtiquetas(); localStorage.setItem('tamanoFuenteP15', sliderTamano.value); }
        });

        // ------------------ LOGICA DEL MODAL Y EXPORTACIÓN ------------------

        // 1. Abrir Modal de Previsualización
        btnPrevisualizar?.addEventListener('click', () => {
            if (!contenedor || etiquetasArray.length === 0) {
                mostrarToast('ERROR: NO HAY ETIQUETAS PARA MOSTRAR');
                return;
            }
            mostrarToast('PROCESANDO IMAGEN...');
            
            // Genera la imagen limpia (ignora botones rojos de borrar)
            html2canvas(contenedor, { scale: 4, backgroundColor: "#ffffff" }).then(canvas => {
                previewImg.src = canvas.toDataURL("image/png");
                modalPreview.classList.remove('hidden');
            });
        });

        // 2. Cerrar Modal
        btnCerrarModal?.addEventListener('click', () => {
            modalPreview.classList.add('hidden');
            previewImg.src = "";
        });

        // 3. Descargar desde el Modal
        btnDescargarModal?.addEventListener('click', () => {
            if (!previewImg.src) return;
            const link = document.createElement('a');
            link.download = `etiquetas_${impresoraActual}_${Date.now()}.png`;
            link.href = previewImg.src;
            link.click();
            mostrarToast('SYSTEM: IMAGEN DESCARGADA');
        });

        // 4. Imprimir directamente usando una ventana temporal
        btnImprimirModal?.addEventListener('click', () => {
            if (!previewImg.src) return;
            
            // Abre una ventana oculta para invocar la cola de impresión del sistema
            const win = window.open('', '_blank');
            if (!win) {
                mostrarToast('ERROR: EL NAVEGADOR BLOQUEÓ LA VENTANA DE IMPRESIÓN');
                return;
            }

            win.document.write(`
                <html>
                    <head>
                        <title>Imprimir Etiquetas</title>
                        <style>
                            /* Reset estricto para evitar márgenes en el papel térmico */
                            @page { margin: 0; }
                            body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: flex-start; background: #fff; }
                            img { max-width: 100%; height: auto; }
                        </style>
                    </head>
                    <body>
                        <img src="${previewImg.src}" onload="window.print(); setTimeout(() => window.close(), 500);">
                    </body>
                </html>
            `);
            win.document.close();
        });

        // ------------------ SISTEMA DE MEMORIA ------------------
        function guardarEnMemoria() { localStorage.setItem('etiquetasTerminal', JSON.stringify(etiquetasArray)); }
        
        function cargarDeMemoria() {
            const guardado = localStorage.getItem('etiquetasTerminal');
            if (guardado) { try { etiquetasArray = JSON.parse(guardado); } catch(e) { etiquetasArray = []; } }
            
            const tamanoGuardado = localStorage.getItem('tamanoFuenteP15');
            if (tamanoGuardado && sliderTamano) sliderTamano.value = tamanoGuardado;
            
            // Cargar Offsets (Centrado) Guardados
            const offsets = localStorage.getItem('offsetsEtiquetas');
            if (offsets) { try { offsetsGuardados = JSON.parse(offsets); } catch(e) {} }

            const impresoraGuardada = localStorage.getItem('impresoraSeleccionada');
            setImpresora(impresoraGuardada || 'orgbro');
        }

        window.addEventListener('load', () => cargarDeMemoria());
        
        // PWA Service Worker Registration
        if (window.location.protocol === 'https:' || window.location.hostname === 'localhost') {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js'); });
            }
        }
    </script>
</body>
</html>
